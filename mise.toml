[tools]
node = "26.12.1"
pnpm = "12.15.0"

[tasks.setup]
description = "Install project dependencies, Git hooks, and the Chromium test browser"
run = ["vp install --frozen-lockfile", "vp run prepare", "vp exec playwright install chromium"]

[tasks."ui:add"]
description = "Add shadcn components (for example: mise run ui:add checkbox)"
run = "vp run ui:add"
raw = true

[tasks.dev]
run = "vp run dev"
[tasks.build]
run = "vp run build"
[tasks.preview]
run = "vp run preview"
[tasks.format]
run = "vp run format"
[tasks.check]
run = "vp run check"
[tasks."test:e2e"]
run = "vp run test:e2e"
[tasks.verify]
run = "vp run verify"
[tasks."hooks:install"]
run = "vp run hooks:install"
[tasks."hooks:check"]
run = "vp run hooks:check"
