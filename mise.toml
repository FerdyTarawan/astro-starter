[tools]
node = "26.12.1"
pnpm = "12.15.0"

[tasks.dev]
run = "pnpm exec vp run dev"
[tasks.build]
run = "pnpm exec vp run build"
[tasks.preview]
run = "pnpm exec vp run preview"
[tasks.format]
run = "pnpm run format"
[tasks.check]
run = "pnpm run check"
[tasks."test:e2e"]
run = "pnpm run test:e2e"
[tasks.verify]
run = "pnpm run verify"
[tasks."hooks:install"]
run = "pnpm run hooks:install"
[tasks."hooks:check"]
run = "pnpm run hooks:check"
