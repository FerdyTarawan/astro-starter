name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v3
      - name: Install Vite Plus
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          version-file: package.json
          node-manager: false
          package-manager: false
          cache: true
          run-install: |
            - args: ['--frozen-lockfile']
      - run: vp exec playwright install --with-deps chromium
      - run: mise run verify
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
